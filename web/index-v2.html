<title>MirrorBall v2 — sala branca</title>
<!--
  DESIGNER A — "fotográfico". Intenção: uma bola de espelhos sólida, densa e nítida, pendurada
  numa corrente num vazio escuro com névoa fina; nada é desenhado à mão — a cena é um modelo 3D
  mínimo (esfera facetada com normais por tile, K spots fora do ecrã, câmara em perspetiva, uma
  sala implícita de 5 planos) e cada frame calcula, para cada tile × spot, a reflexão
  R = L − 2(N·L)N. Dessa única equação saem os três fenómenos: o glint (N alinhado com o
  half-vector spot/câmara, pow(N·H,k)), o feixe na névoa (wedge que nasce NA superfície do tile
  na direção projetada de R, intensidade ∝ N·L × haze) e o ponto na parede (R intersetado com o
  caixote da sala, elipse esticada pelo ângulo rasante, projetada em perspetiva). Só ω·t muda no
  tempo, por isso tudo gira em bloco. Técnica: Canvas 2D, dpr-aware, polígonos por tile com
  juntas por inset angular, bloom numa única passagem de blur num canvas offscreen a meia
  resolução, grão pré-gerado em pattern, dotDensity adaptativo ao frame time. Greyscale puro.
-->

  canvas#mb{position:fixed;inset:0;width:100%;height:100%;display:block;background:#070707}

       display:none;min-width:230px;letter-spacing:.02em;z-index:9}
  #dbg.on{display:block;max-height:calc(100vh - 24px);overflow:auto;resize:both;font-size:calc(11px * var(--dbgScale,1))}
  #dbg .knobs{display:grid;grid-template-columns:repeat(var(--dbgCols,1),minmax(230px,1fr));column-gap:18px}
  #dbg .sz{display:flex;gap:4px;margin:0 0 6px}
  #dbg .sz button{font:inherit;background:#222;color:#ccc;border:1px solid #444;padding:0 6px;cursor:pointer}
  #dbg label{display:flex;justify-content:space-between;gap:10px;align-items:center}

  #emo{position:fixed;top:12px;right:12px;background:rgba(10,10,10,.86);color:#cfcfcf;font:11px/1.5 ui-monospace,Consolas,monospace;
       padding:10px 12px;border:1px solid #2a2a2a;white-space:pre;display:none;z-index:9}
  #emo.on{display:block}
  html.mini #ui,html.mini #cam{display:none}
  /* HUD do motor musical (tecla m) — canto inferior esquerdo, para não colidir com #emo (topo/direita) */
  #mus{position:fixed;left:12px;bottom:44px;background:rgba(10,10,10,.86);color:#cfcfcf;font:11px/1.5 ui-monospace,Consolas,monospace;
       padding:10px 12px;border:1px solid #2a2a2a;white-space:pre;display:none;z-index:9;max-height:70vh;overflow:hidden}
  #mus.on{display:block}
</style>

<script>
'use strict';
/* ============================ CONFIG (único sítio com números) ============================ */
const CONFIG = {
  ballSizeVH: 0.52,          // diâmetro da bola em fração da altura do viewport
  ballCenter: [0.5, 0.53],   // posição do centro (fração da largura/altura)
  facetRows: 48,             // filas de latitude (32 original → 48: espelhos a 2/3, ~2.25× tiles) (tiles quadrados → equador tem ~2·facetRows tiles)
  rotationRpm: 1.0,          // rotação real de uma bola (0.5–3 rpm)
  spots: [                   // pinspots FORA do ecrã; az/el em graus a partir da câmara; radius = raio do foco na
                             // superfície (em raios da bola, DIÂMETRO CONSTANTE — não pulsa com a intensidade)
    // Rig realista (docs/lighting-design-research.md): 2 pinspots OPOSTOS ao nível/ligeiramente acima do
    // equador (el 30-45°), nunca do lado do público (az≈0 é atrás da câmara) nem de cima; miram o equador.
    // A sala é 3D e a bola é o centro: az=0 é a direção do público (câmara). Fontes nos LADOS da sala, à frente
    // do plano da bola (|az| 40-60°), quase ao nível do equador — assim os espelhos da frente refletem para nós.
    { az:  -52, el: 14, intensity: 1.00, radius: 0.16, period: 13, aim: [0, 0.03] },   // esquerda-frente
    { az:   52, el: 12, intensity: 0.95, radius: 0.15, period: 17, aim: [0, 0.03] },   // direita-frente (oposto)
    // 3º/4º: nos LADOS (|az|≈82°), não atrás — a ±125° a mancha caía no hemisfério invisível e "não apareciam"
    { az:  -82, el: 20, intensity: 0.80, radius: 0.15, period: 11, aim: [0, 0.05] },   // esquerda-lado (3º, opcional)
    { az:   82, el: 20, intensity: 0.80, radius: 0.15, period: 19, aim: [0, 0.05] },   // direita-lado (4º, opcional)
    { az:  -30, el: 30, intensity: 0.75, radius: 0.14, period: 23, aim: [0, 0] },      // 5º/6º: mais altos, só se o David quiser
    { az:   30, el: 30, intensity: 0.75, radius: 0.14, period: 29, aim: [0, 0] },
  ],
  spotCount: 2,              // quantos pinspots estão montados (0-6; 0 = só luz indireta + flashes) — knob no painel d
  spotRadiusMul: 1.0,        // multiplicador global do raio dos focos — knob no painel d
  mirrorGain: 1.0,           // brilho dos espelhos quando a luz incide (não são os feixes) — knob no painel d
  choreo: {                  // coreografia interna dos focos (um técnico de luz a apontar os pinspots)
    enabled: true,
    retarget: false,         // pinspots reais têm aim FIXO: o técnico trabalha o dimmer, não move o foco. Knob liga saltos.
    dwell: [4.0, 12.0],      // (se retarget) s que um foco fica no mesmo sítio antes de saltar
    move: 0.08,              // s do apagar e do acender na troca de sítio (o foco NUNCA anda: apaga, salta, acende)
    azRange: [35, 130], elRange: [5, 30], aimMax: 0.35, // poses plausíveis: |az| lateral/traseiro (sinal sorteado), el 22-48°, mira perto do equador
    flashRate: 0.6,          // flashes/s em média (disparos curtos de posições plausíveis)
    flashLen: [0.09, 0.22],  // s de cada flash
    flashRadius: [0.10, 0.18], flashIntensity: [0.6, 1.0], flashSlots: 4,
  },
  ambient: {                 // luz INDIRETA da sala (varredores, LEDs, reflexos): fontes largas e fracas que deambulam
    n: 3, intensity: 0.07, areaDeg: 32, drift: 0.045, // n fontes; brilho; meia-largura angular da ÁREA refletida (°); velocidade (rad/s)
    // NÃO são focos: são áreas largas da sala (parede/teto claros) que os espelhos devolvem — cada espelho com o seu brilho
  },
  shade: { key: 0.55, az: -35, el: 40 }, // luz GERAL da sala (volume da esfera): tiles virados para ela mais claros; 0 = plano
  halo: 0.3,                 // auréola de névoa à volta da bola (1 = como antes; 0 = nenhuma)
  ballContrast: 1.0,         // contraste das facetas (0.5-2.5): estica os cinzas à volta do nível médio — ver melhor a bola sem a lavar
  ballLight: 0.0,            // luz da BOLA (0-1): sobe uniformemente o cinza das facetas, ANTES do volume/luz geral (mantém o 3D) — knob
  bgGrey: 7,                 // cinza do fundo em dark (0-60): quanto "escuro" é o escuro — knob 'fundo: claridade'
  strobe: {                  // estrobo de FUNDO (a sala atrás pisca, não a bola). O motor só o usa se enabled.
    enabled: false, level: 0.55, lenMs: 55, minGapMs: 340, // level = alpha do branco; cadência ≤ 3 Hz (regra 6)
  },
  spotEdge: 0.35,            // suavidade da orla do foco (fração do raio)
  glintSharp: 0.75,          // quanto o brilho especular (N·H) marca dentro do foco (0 = foco uniforme)
  incidentAlpha: 0.06,       // pico do eixo de névoa que CHEGA à bola (junto ao limbo); ×haze×intensity×dk
  incidentLen: 3.2,          // alcance do eixo incidente em raios da bola (a névoa acesa apaga-se depressa)
  incidentMaxWidth: 1.3,     // teto relativo: meia-largura ≤ este × raio da mancha na bola (nunca uma banda)
  incidentMaxPx: 0.14,       // teto absoluto: meia-largura ≤ este × Rpx — 4-6° não ocupa meio ecrã, mesmo com raio ×3
  beamLen3D: 3.6,            // comprimento do feixe refletido em raios da bola (3D, projetado)
  beamGlowZ: 0.8,            // R·z acima disto = feixe a vir para nós → brilho em vez de linha
  haze: 0.65,                // densidade da névoa (só afeta feixes e a auréola)
  beamMaxCount: 110,         // feixes visíveis no máximo
  beamFractionMax: 1.0,      // teto do painel d: o motor escreve beamFraction = fração musical × isto
  hazeMax: 1.0,              // teto do painel d: o motor escreve haze = haze musical × isto
  beamFraction: 1.0,         // fração dos tiles do foco a produzir feixe (1 = todos os espelhos iluminados)
  beamIntensity: 0.16,       // alpha máximo de um feixe (núcleo)
  beamWidthDeg: 0.7,         // meia-largura angular do wedge exterior — knob 'feixes: largura°'
  beamSoft: 0.5,             // dispersão 0..1: 0 = laser (só núcleo, orla dura), 1 = difuso (halo largo, núcleo fraco) — knob
  beamLength: 0.78,          // comprimento em fração do viewport
  dotDensity: 0.8,           // fração dos tiles elegíveis a projetar ponto na parede (adaptativo) — knob 'pontos na parede'
  strobeRate: 1.0,           // multiplicador da frequência dos estrobos do motor (0 = nunca, 1 = normal, 3 = 3×) — knob
  dotScale: 0.32,            // tamanho do ponto na parede relativo ao tile projetado
  dotMaxGrey: 0xd8,          // teto de brilho dos pontos
  bloomStrength: 0.75,       // alpha da passagem de bloom
  bloomBlurPx: 9,            // raio do blur (em px CSS, a meia resolução)
  opacityMotor: false,       // false (defeito, pedido do David) = o motor não escreve sphereOpacity; liga-se no painel d
  beamsMotor: true,          // false = o motor não toca em beamFraction/beamIntensity/haze
  spotsMotor: true,          // false = o motor não toca na intensidade dos focos (nem flashes)
  sphereOpacity: 1.0,        // 1 = sólida; → 0 = raio-X (só malha + tiles ativos persistem)
  seamDarkness: 0.02,        // cinza das juntas (0..1)
  seamInset: 0.15,           // fração angular do tile reservada à junta (≈1–2 px)
  rimStrength: 0.22,         // borda clara nas facetas rasantes
  baseTileGrey: [0.045, 0.14], // intervalo do cinza das facetas apagadas (a sala escura refletida)
  litSideGain: 0.55,         // facetas viradas para os spots refletem sala um pouco mais clara
  glintK: 24,                // expoente do pow(N·H, k) do brilho especular dentro do foco
  camDistance: 7.0,          // distância da câmara em raios da bola (perspetiva ligeira)
  room: { halfW: 5.2, ceil: 4.2, floor: -5.0, back: -7.0 }, // sala implícita em raios
  dotFalloff: 0.028,         // atenuação dos pontos com a distância (1/(1+k·t²))
  grain: 0.032,              // grão de filme (alpha)
  vignette: 0.55,            // força da vinheta
  chainLinkPx: 11,           // tamanho de cada elo da corrente
  driftPeriod: 38,           // segundos da deriva lenta do cinza por tile
  perf: { targetMs: 17.5, minDotDensity: 0.12 },
  skin: 'auto',              // 'dark' | 'white' | 'auto' (auto = emoções decidem)
  skinEase: 7.0,             // crossfade dark↔white (por segundo); o emotion.js já suaviza o alvo com attack/release
  skinAutoValence: 1.6,      // auto: skinTarget = max(0, valência) × isto (neutro/triste → dark, feliz → white)
  spotFadeMix: 1.0,          // 1 = fade interno dos spots como hoje; 0 = intensidade constante, para uma fonte externa coreografar
  explode: {                 // estoiro em estilhaços (MIRRORBALL.explode() / tecla x); tudo paramétrico em s∈[0,1] → rewind = s a descer
    burstSec: 0.16,          // 1º tempo: estoiro seco até burstS (ainda tem forma de bola, só rachada)
    burstS: 0.16,            // …fração do percurso percorrida no estoiro
    driftSec: 6.0,           // 2º tempo: câmara lenta — os estilhaços continuam a sair do centro (easeOut)
    hold: 0.5,               // s suspenso no fim da deriva antes do rewind automático
    maxHold: 14,             // teto absoluto (s desde o estoiro) — com autoHold:false, força o rewind
    rewind: 0.9,             // 3º tempo: sucção de volta (easeInOutCubic)
    radial: 1.9,             // alcance radial em raios da bola
    depth: 0.45,             // escala do deslocamento em z (1 = esférico; <1 mantém os estilhaços mais no plano)
    jitter: 0.45,            // dispersão lateral da trajetória
    floatSpin: 0.35,         // em pausa (hold/held) os estilhaços continuam a tombar (rad/s) …
    floatBob: 0.05,          // …e a flutuar (amplitude em raios); dissolve-se nos primeiros 30% do rewind
    gravity: 1.1,            // queda (em s², continua função pura de s)
    spinMax: 3.2,            // tombo máximo de cada estilhaço (rad) — a normal roda, o reflexo varre a sala
  },
};
// Quadrado do OS (sidebar): ?mini=1 encolhe a corrente, sobe a bola, alonga feixes e pontos
// para lerem num quadrado de ~200 px; ?scale=1.2 = bola +20% (mesmo contrato das bolas A/D do OS).
(function () {
  const q = new URLSearchParams(location.search);
  const scale = parseFloat(q.get('scale')) || 1;
  if (q.get('mini') === '1') {
    Object.assign(CONFIG, { ballSizeVH: 0.66, ballCenter: [0.5, 0.56], chainLinkPx: 6, beamLength: 1.0, beamWidthDeg: 1.6,
      dotScale: 0.5, bloomBlurPx: 5, grain: 0.02, vignette: 0.35, facetRows: 39 });
    document.documentElement.classList.add('mini');
    CONFIG.skin = q.get('light') === '1' ? 'white' : 'dark';   // quadrado segue a skin do OS
  }
  CONFIG.ballSizeVH *= scale;
})();
const PRESETS = {
  ALIVE: { spotGain: 1.0,  rotationRpm: CONFIG.rotationRpm, sphereOpacity: CONFIG.sphereOpacity, haze: CONFIG.haze },
  DEAD:  { spotGain: 0.22, rotationRpm: 0.12, sphereOpacity: 0.35, haze: 0.25 },
};
/* ========================================================================================= */

const TAU = Math.PI * 2, D2R = Math.PI / 180;
const cv = document.getElementById('mb'), ctx = cv.getContext('2d', { alpha: false });
const cvw = document.getElementById('mbw'), wctx = cvw.getContext('2d', { alpha: false });
const bloomCv = document.createElement('canvas'), bctx = bloomCv.getContext('2d');
const grainCv = document.createElement('canvas');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, DPR = 1, grainPattern = null;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cvw.width = cv.width; cvw.height = cv.height;
  bloomCv.width = Math.round(W * DPR / 2); bloomCv.height = Math.round(H * DPR / 2);
  buildGrain();
}
function buildGrain() {
  const s = 256; grainCv.width = grainCv.height = s;
  const g = grainCv.getContext('2d'), img = g.createImageData(s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
  g.putImageData(img, 0, 0);
  grainPattern = ctx.createPattern(grainCv, 'repeat');
}
addEventListener('resize', resize); resize();

/* ---------------- geometria da esfera: filas de latitude, normais por tile ---------------- */
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const tiles = [];
function buildTiles() { // reconstrói a malha (knob "espelhos: filas" no painel d)
  tiles.length = 0;
  const rows = Math.max(6, Math.round(CONFIG.facetRows)), dphi = Math.PI / rows;
  let id = 0;
  for (let i = 0; i < rows; i++) {
    const phi = -Math.PI / 2 + (i + 0.5) * dphi, cosphi = Math.cos(phi);
    const n = Math.max(3, Math.round(TAU * cosphi / dphi)), dth = TAU / n;
    for (let j = 0; j < n; j++) {
      const h0 = hash(id), h1 = hash(id + 0.37), h2 = hash(id + 0.71);
      tiles.push({
        phi, th: j * dth + (i % 2) * dth * 0.5, dphi, dth,
        grey: CONFIG.baseTileGrey[0] + h0 * (CONFIG.baseTileGrey[1] - CONFIG.baseTileGrey[0]),
        driftPhase: h1 * TAU, beamHash: h2, dotHash: hash(id + 0.53),
        // sementes fixas da explosão: trajetória e tombo determinísticos por tile (rewind exato)
        exJit: norm3([hash(id + 0.13) - 0.5, hash(id + 0.29) - 0.5, hash(id + 0.47) - 0.5]),
        exAxis: norm3([hash(id + 0.61) - 0.5, hash(id + 0.77) - 0.5, hash(id + 0.89) - 0.5]),
        exSpeed: 0.6 + 0.8 * hash(id + 0.23), exSpin: 0.35 + 0.65 * hash(id + 0.43),
      });
      id++;
    }
  }
}
buildTiles();

/* ---------------- estado runtime: health, câmara, spots ---------------- */
let health = 1.0, dotDensityLive = CONFIG.dotDensity, frameEma = 16, lastT = performance.now();
let angle = 0, grainOffset = [0, 0], grainTick = 0;
let skinMix = 0, skinTarget = 0, skinAuto = 0; // 0 = dark, 1 = white
const spotsOn = CONFIG.spots.map(() => true);
// coreografia: por spot, origem/alvo da viagem e relógio do dwell; flashes = disparos curtos independentes
const choreo = CONFIG.spots.map((s, i) => ({ t: 1.5 + i * 1.7, to: null, mt: 1, gain: 1 }));
const flashes = [];
let strobeT0 = -1e9, strobeLevel = 0; // estrobo de fundo: instante do último disparo
let flashAcc = 0;
function rnd(a, b) { return a + Math.random() * (b - a); }
function randomPose() {
  const C = CONFIG.choreo, r = Math.sqrt(Math.random()) * C.aimMax, a = Math.random() * TAU;
  const az = rnd(C.azRange[0], C.azRange[1]) * (Math.random() < 0.5 ? -1 : 1); // nunca do lado do público (az≈0)
  return { az, el: rnd(C.elRange[0], C.elRange[1]), aim: [r * Math.cos(a), r * Math.sin(a) * 0.6] };
}
function stepChoreo(dt) {
  const C = CONFIG.choreo; if (!C.enabled || reducedMotion) return;
  CONFIG.spots.forEach((s, i) => {
    const c = choreo[i];
    if (c.to) { // troca de sítio: apaga (mt 0→1), salta de posição a meio, acende (mt 1→2). Nunca varre a superfície.
      c.mt = Math.min(2, c.mt + dt / Math.max(C.move, 0.01));
      if (c.mt >= 1 && c.to.pending) { s.az = c.to.az; s.el = c.to.el; s.aim[0] = c.to.aim[0]; s.aim[1] = c.to.aim[1]; c.to.pending = false; }
      c.gain = c.mt < 1 ? 1 - c.mt : c.mt - 1;
      if (c.mt >= 2) { c.to = null; c.gain = 1; c.t = rnd(C.dwell[0], C.dwell[1]); }
    } else if (C.retarget) {
      c.t -= dt;
      if (c.t <= 0) { c.to = randomPose(); c.to.pending = true; c.mt = 0; }
    }
  });
  // flashes: processo de Poisson; cada um nasce num sítio novo e morre em ~0.1-0.2 s
  flashAcc += dt * C.flashRate;
  while (flashAcc >= 1) { flashAcc -= 1; if (flashes.length < C.flashSlots) {
    const p = randomPose();
    flashes.push({ az: p.az, el: p.el, aim: p.aim, radius: rnd(C.flashRadius[0], C.flashRadius[1]),
      intensity: rnd(C.flashIntensity[0], C.flashIntensity[1]), life: rnd(C.flashLen[0], C.flashLen[1]), age: 0 });
  } }

  const drawBeam = (b, base) => {

      const g = ctx.createRadialGradient(pr[0], pr[1], 0, pr[0], pr[1], rad);
      g.addColorStop(0, `rgba(255,255,255,${(base * 0.9).toFixed(4)})`);
      g.addColorStop(0.35, `rgba(255,255,255,${(base * 0.35).toFixed(4)})`);

    if (L3 < 0.2) return;

    const dx = pe[0] - pr[0], dy = pe[1] - pr[1], len = Math.hypot(dx, dy); if (len < 2) return;

      gg.addColorStop(0, `rgba(255,255,255,${a.toFixed(4)})`);
      gg.addColorStop(0.35, `rgba(255,255,255,${(a * 0.55).toFixed(4)})`);
      gg.addColorStop(1, 'rgba(255,255,255,0)');
      const hE = Math.tan(widths[w]) * wEnd + wStart, hS = wStart * (w === 0 ? 1 : w === 1 ? 0.6 : 0.3);
      ctx.fillStyle = gg; ctx.beginPath();
      ctx.moveTo(pr[0] + px * hS, pr[1] + py * hS); ctx.lineTo(pe[0] + px * hE, pe[1] + py * hE);

  for (let i = 0; i < nb; i++) {
    const b = beams[i], base = clamp(b.I, 0, 1) * CONFIG.beamIntensity * smooth(0, 6, nb - i); // os últimos esbatem

  // ----- corrente -----
  ctx.globalCompositeOperation = 'source-over';
  drawChain(cx, cy - Rpx, spots);

  // ----- a bola: disco (juntas) + facetas -----
  const op = E.sphereOpacity;
  if (exS < 0.98) { // o disco das juntas desfaz-se com a bola
    ctx.globalAlpha = op * (1 - exS);
    ctx.fillStyle = `rgb(${Math.round(CONFIG.seamDarkness * 255)},${Math.round(CONFIG.seamDarkness * 255)},${Math.round(CONFIG.seamDarkness * 255)})`;
    ctx.beginPath(); ctx.arc(cx, cy, Rpx * (camD / Math.sqrt(camD * camD - 1)) * Math.sqrt(1 - 1 / (camD * camD)), 0, TAU); ctx.fill();

  }

  const inset = CONFIG.seamInset, meshAlpha = (1 - op) * 0.45;
  const shadeDir = spotDir({ az: CONFIG.shade.az, el: CONFIG.shade.el });

  bctx.globalCompositeOperation = 'source-over';
  bctx.clearRect(0, 0, W, H);

    const T = v.T, N = v.N;
    const p0 = T.phi - T.dphi * (0.5 - inset / 2), p1 = T.phi + T.dphi * (0.5 - inset / 2);
    const t0 = v.th - T.dth * (0.5 - inset / 2), t1 = v.th + T.dth * (0.5 - inset / 2);
    const c0 = Math.cos(p0), s0 = Math.sin(p0), c1 = Math.cos(p1), s1 = Math.sin(p1);
    let A, B, C, D;
    if (v.exRot) { // estilhaço: cantos relativos ao centro original, tombados e levados para P
      const R = v.exRot, corner = (x, y, z) => {
        const r = rodrigues([x - v.N0[0], y - v.N0[1], z - v.N0[2]], R.k, R.sA, R.cA);

      A = corner(c0 * Math.cos(t0), s0, c0 * Math.sin(t0)); B = corner(c0 * Math.cos(t1), s0, c0 * Math.sin(t1));

      C = proj(c1 * Math.cos(t1), s1, c1 * Math.sin(t1)); D = proj(c1 * Math.cos(t0), s1, c1 * Math.sin(t0));

    { const mid = 0.5 * (CONFIG.baseTileGrey[0] + CONFIG.baseTileGrey[1]) + 0.45 * clamp(CONFIG.ballLight || 0, 0, 1);

    const gl = clamp(v.glint, 0, 1);

    const alpha = lerp(op, 1, gl); // em raio-X só os tiles ativos persistem
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${vv},${vv},${vv})`;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(C[0], C[1]); ctx.lineTo(D[0], D[1]); ctx.closePath(); ctx.fill();
    if (meshAlpha > 0.01) { // malha tipo osso no raio-X

    }

  ctx.globalAlpha = 1;

  // ----- bloom: uma passagem de blur num canvas a meia resolução -----
  if (bloomItems.length) {
    for (const it of bloomItems) {
      bctx.fillStyle = `rgba(255,255,255,${(it[4] * 0.9).toFixed(3)})`;
      bctx.beginPath(); bctx.moveTo(it[0][0], it[0][1]); bctx.lineTo(it[1][0], it[1][1]); bctx.lineTo(it[2][0], it[2][1]); bctx.lineTo(it[3][0], it[3][1]); bctx.closePath(); bctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = CONFIG.bloomStrength;
    ctx.filter = `blur(${CONFIG.bloomBlurPx}px)`;
    ctx.drawImage(bloomCv, 0, 0, W, H);

    ctx.globalCompositeOperation = 'source-over';

  // ----- feixes que vêm para a câmara: por cima da bola (miniaturas, nunca magoam) -----
  if (beamsFront.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const [b, base] of beamsFront) drawBeam(b, base);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ----- vinheta + grão -----
  const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.35, cx, cy, Math.hypot(W, H) * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${(CONFIG.vignette * dk).toFixed(3)})`);

  // ----- skin white: mesma imagem, tonemap SVG no overlay, crossfade por opacidade -----
  if (sk > 0.002) { wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.drawImage(cv, 0, 0); }
  cvw.style.opacity = sk.toFixed(3);
  document.body.style.background = `rgb(${Math.round(lerp(bgG, 243, sk))},${Math.round(lerp(bgG, 247, sk))},${Math.round(lerp(bgG, 249, sk))})`;
  requestAnimationFrame(frame);
}

function drawChain(x, yTop, spots) {
  const L = CONFIG.chainLinkPx, litSide = spots.reduce((a, s) => a + s.S[0] * s.I, 0);
  let y = yTop - L * 0.4, i = 0;
  // gancho
  ctx.strokeStyle = 'rgb(120,120,120)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, yTop - L * 0.25, L * 0.32, 0, TAU); ctx.stroke();
  while (y > -L) {
    const flat = i % 2 === 0; // elos alternam: um de frente (elipse), um de lado (barra)
    const shade = 70 + 45 * Math.max(0, Math.sin(i * 0.9)) + 30 * Math.abs(litSide);
    const v = Math.round(clamp(shade, 40, 170));
    ctx.strokeStyle = `rgb(${v},${v},${v})`; ctx.lineWidth = flat ? 1.6 : 2.4;

    ctx.stroke();
    y -= L * 0.82; i++;
  }
}

/* S3c — disjuntor do lado da BOLA (espelho de spike-babylon/v2/main.js:1657 `motorAllowed`).

   (`{fromMotor:true}`) são filtradas — a consola do David e as teclas continuam a passar. */
function motorAllowed(kind, opts) {
  if (!(opts && opts.fromMotor)) return true;
  if (kind === 'spots') return CONFIG.spotsMotor !== false;
  if (kind === 'beams') return CONFIG.beamsMotor !== false;
  if (kind === 'opacity') return CONFIG.opacityMotor !== false;
  return true;
}

  // ⚠ prioridade: o que o David tocou por último (localStorage) GANHA; o ficheiro só preenche knobs nunca mexidos.

  setSpot(i, partial) {

    flashes.push({ az: o.az != null ? o.az : p.az, el: o.el != null ? o.el : p.el, aim: o.aim || p.aim,
