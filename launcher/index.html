<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MirrorBall Launcher</title>
<style>
:root{--bg:#0d0d10;--fg:#e8e8ee;--mut:#8a8a96;--card:#17171c;--ln:#2a2a32;--ok:#4ade80;--off:#52525b;--ac:#7c8cff}
@media (prefers-color-scheme:light){:root{--bg:#f4f4f7;--fg:#16161a;--mut:#666;--card:#fff;--ln:#d9d9e0;--off:#a1a1aa;--ac:#4f46e5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:24px 16px}
main{max-width:640px;margin:0 auto}h1{font-size:22px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--off);margin-right:8px}.on .dot{background:var(--ok)}
button,a.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--ac)}button:disabled{opacity:.5;cursor:wait}
a.go{background:var(--ac);color:#fff;border-color:var(--ac)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:480px){.choices{grid-template-columns:1fr}}
h2{font-size:17px;margin:0 0 4px}.mut{color:var(--mut);font-size:14px;margin:0 0 12px}
#msg{color:var(--mut);font-size:14px;min-height:20px}
</style>
<main>
<h1>MirrorBall</h1>
<div class="card" id="sc"><div class="row"><div><span class="dot"></span><b>Audio sidecar</b> <span class="mut" id="sct">:3739</span></div><button id="scb">…</button></div></div>
<div class="choices">
 <div class="card"><h2>Bola 2D</h2><p class="mut">Canvas, <code>?src=music</code>. Precisa do sidecar.</p>
  <a class="btn go" id="go2d" href="#">Abrir 2D</a></div>
 <div class="card" id="v3"><h2>V3 (Babylon)</h2><p class="mut"><span class="dot"></span><span id="v3t">serve.py :8099</span></p>
  <a class="btn go" id="gov3" href="#">Abrir V3</a> <button id="v3b">…</button></div>
</div>
<div class="card" id="wl"><h2>MirrorBall plugin <span class="mut">(fundo vivo do Omarchy)</span></h2>
 <p class="mut"><span class="dot"></span><span id="wlt">desligado</span> — liga a bola por baixo das janelas e o sidecar</p>
 <button id="wlb">…</button> <button id="wlk">Preta</button> <button id="wlw">Branca</button> <button id="wlh">Fundo: tema</button></div>
<div id="msg"></div>
</main>
<script>
const $=id=>document.getElementById(id);let S={sidecar:false,v3:false,wall:'off'};
function render(){
 $('sc').classList.toggle('on',S.sidecar);$('sct').textContent=S.sidecar?'a correr (:3739)':'desligado';
 $('scb').textContent=S.sidecar?'Desligar':'Ligar';
 $('wl').classList.toggle('on',S.wall!=='off');$('wlt').textContent=S.wall==='off'?'desligado':'ligado — bola '+(S.wall==='white'?'branca':'preta');$('wlh').textContent='Fundo do tema: '+(S.theme?'on':'off');$('wlb').textContent=S.wall==='off'?'Ligar':'Desligar';
 $('v3').classList.toggle('on',S.v3);$('v3b').textContent=S.v3?'Parar serve.py':'Ligar';
}
async function api(p,m='GET'){const r=await fetch(p,{method:m,headers:{'X-MB':'1'}});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function toggle(btn,key){btn.disabled=true;$('msg').textContent='…';
 try{const j=await api(`/api/${key}/${S[key]?'off':'on'}`,'POST');S={sidecar:j.sidecar,v3:j.v3,wall:j.wall,theme:j.theme};$('msg').textContent=j.msg}
 catch(e){$('msg').textContent='Erro: '+e.message}btn.disabled=false;render()}
async function wall(a){$('msg').textContent='…';try{const j=await api('/api/wall/'+a,'POST');S={sidecar:j.sidecar,v3:j.v3,wall:j.wall,theme:j.theme};$('msg').textContent=j.msg}catch(e){$('msg').textContent='Erro: '+e.message}render()}
$('wlb').onclick=()=>wall(S.wall==='off'?'black':'off');$('wlk').onclick=()=>wall('black');$('wlw').onclick=()=>wall('white');$('wlh').onclick=()=>wall('theme');
$('scb').onclick=()=>toggle($('scb'),'sidecar');$('v3b').onclick=()=>toggle($('v3b'),'v3');
// Abrir uma bola = ligar o que falta e navegar NA MESMA janela.
const URLS={'2d':'http://127.0.0.1:3739/app/index-v2.html?src=music','v3':'http://127.0.0.1:8099/app/spike/v2/index.html?src=music'};
async function open(key){$('msg').textContent='a ligar…';
 try{const j=await api('/api/open/'+key,'POST');S={sidecar:j.sidecar,v3:j.v3,wall:j.wall,theme:j.theme};render();location.href=URLS[key]}
 catch(e){$('msg').textContent='Erro: '+e.message}}
$('go2d').onclick=e=>{e.preventDefault();open('2d')};$('gov3').onclick=e=>{e.preventDefault();open('v3')};
async function poll(){try{S=await api('/api/status')}catch{}render()}poll();setInterval(poll,3000);
</script>
